<!-- frontend/templates/bounty.html -->
<!--
  Agent Tasks page — Bounty features for task management.
  Includes: Input Checklist, Search & Filters, Result Highlighting,
  Review Packet Export. All data loaded via JS from /bounty/api/.
-->
{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/bounty.css' %}?v=1">
{% endblock %}

{% block content %}
<div class="bounty-page">

    <!-- ================================================================ -->
    <!-- PAGE HEADER                                                       -->
    <!-- ================================================================ -->
    <section class="kpi-section" id="bounty-header-section">
        <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
            <div class="kpi-card" style="border-left: 4px solid var(--accent-cyan, #22d3ee);">
                <div class="kpi-content">
                    <div class="kpi-value" id="bounty-stat-total" style="font-size:1.8rem;">—</div>
                </div>
                <div class="kpi-label">Total Tasks</div>
            </div>
            <div class="kpi-card" style="border-left: 4px solid var(--accent-green, #10b981);">
                <div class="kpi-content">
                    <div class="kpi-value" id="bounty-stat-complete" style="font-size:1.8rem;">—</div>
                </div>
                <div class="kpi-label">Complete</div>
            </div>
            <div class="kpi-card" style="border-left: 4px solid var(--accent-yellow, #f59e0b);">
                <div class="kpi-content">
                    <div class="kpi-value" id="bounty-stat-progress" style="font-size:1.8rem;">—</div>
                </div>
                <div class="kpi-label">In Progress</div>
            </div>
            <div class="kpi-card" style="border-left: 4px solid var(--accent-red, #ef4444);">
                <div class="kpi-content">
                    <div class="kpi-value" id="bounty-stat-pending" style="font-size:1.8rem;">—</div>
                </div>
                <div class="kpi-label">Pending</div>
            </div>
            <div class="kpi-card" style="border-left: 4px solid #a78bfa;">
                <div class="kpi-content">
                    <div class="kpi-value" id="bounty-stat-missing" style="font-size:1.8rem;">—</div>
                </div>
                <div class="kpi-label">Missing Data</div>
            </div>
        </div>
    </section>

    <!-- ================================================================ -->
    <!-- SEARCH & FILTER TOOLBAR                                          -->
    <!-- ================================================================ -->
    <section class="bounty-toolbar" id="bounty-toolbar">
        <!-- Search Input -->
        <div class="bounty-search-wrap">
            <span class="bounty-search-icon">🔍</span>
            <input type="text"
                   class="bounty-search"
                   id="bounty-search"
                   placeholder="Search tasks by title, section, agent, notes…"
                   autocomplete="off">
        </div>

        <!-- Filters -->
        <div class="bounty-filter-group">
            <span class="bounty-filter-label">Filters:</span>

            <select class="bounty-filter-select" id="bounty-filter-section" aria-label="Filter by section">
                <option value="">All Sections</option>
            </select>

            <select class="bounty-filter-select" id="bounty-filter-status" aria-label="Filter by status">
                <option value="">All Statuses</option>
            </select>

            <select class="bounty-filter-select" id="bounty-filter-owner" aria-label="Filter by agent">
                <option value="">All Agents</option>
            </select>

            <button class="bounty-missing-toggle" id="bounty-missing-toggle"
                    title="Show only tasks with missing data">
                ⚠ Missing Data
            </button>

            <button class="bounty-btn-reset" id="bounty-btn-reset" title="Reset all filters">
                ✕ Reset
            </button>

            <span class="bounty-active-filters" id="bounty-active-filters"></span>
        </div>
    </section>

    <!-- ================================================================ -->
    <!-- TASK COUNT                                                        -->
    <!-- ================================================================ -->
    <div class="bounty-task-count" id="bounty-task-count">Loading…</div>

    <!-- ================================================================ -->
    <!-- TASK LIST                                                         -->
    <!-- ================================================================ -->
    <section class="bounty-task-list" id="bounty-task-list">
        <div class="bounty-loading">
            <div class="bounty-spinner"></div>
            <div>Loading agent tasks…</div>
        </div>
    </section>

</div>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/bounty.js' %}?v=1"></script>
<script>
    // Update summary stats when tasks load
    (function() {
        const origFetch = window.fetch;
        window.fetch = function() {
            return origFetch.apply(this, arguments).then(response => {
                // Clone to read body without consuming
                const clone = response.clone();
                if (arguments[0] && arguments[0].toString().includes('/bounty/api/tasks/')) {
                    clone.json().then(data => {
                        if (data.success) {
                            const tasks = data.tasks;
                            const el = id => document.getElementById(id);
                            // Use all tasks from the unfiltered response
                            const all = tasks;
                            el('bounty-stat-total').textContent = all.length;
                            el('bounty-stat-complete').textContent = all.filter(t => t.status === 'complete').length;
                            el('bounty-stat-progress').textContent = all.filter(t => t.status === 'in_progress').length;
                            el('bounty-stat-pending').textContent = all.filter(t => t.status === 'pending').length;
                            el('bounty-stat-missing').textContent = all.filter(t => t.missing_data).length;
                        }
                    }).catch(() => {});
                }
                return response;
            });
        };
    })();
</script>
{% endblock %}
